[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# URL is overridden at runtime by migrations/env.py using the DATABASE_URL
# environment variable from backend/.env. This placeholder is never used.
sqlalchemy.url = postgresql+psycopg://localhost/placeholder_overridden_by_env

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
